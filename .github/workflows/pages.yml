# 統一前端部署到 GitHub Pages（erucmoney.com）
#
# 觸發：push 到 main（src/、public/、package.json 或本檔有變動），或手動 workflow_dispatch。
# 產物：build/（含 public/CNAME = erucmoney.com；GitHub Pages 讀它設自訂網域）。
# BrowserRouter 的深層路徑（/schedule、/stock…）在 GitHub Pages 會 404，所以把 index.html 複製成 404.html 當 fallback。
#
# 第一次要在 repo Settings → Pages → Source 選「GitHub Actions」。
# 正式環境的 API 位址在下面 env 設：行事曆後端經 Cloudflare Tunnel 對外；股票功能全部走它的 /api/stock 代理。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一個 ref 才互相取消：PR 的檢查跑（不部署）和 main 的部署跑本來就無關，共用一組會讓 PR 一開
# 就把 main 正在進行的部署取消掉（2026-09-30 d9d6103 就是這樣被取消，網站沒更新）。
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:unit                          # 單元測試沒過就不建置、不部署

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CI: 'false'                                   # 既有 ESLint 警告不當錯誤
          REACT_APP_BASEURL: https://calendar-api.erucmoney.com
      - run: cp build/index.html build/404.html         # SPA fallback
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
